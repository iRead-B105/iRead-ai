[project]
name = "iread-ai"
version = "0.1.0"
description = "iRead AI service"
requires-python = ">=3.12"
dependencies = [
    "azure-cognitiveservices-speech>=1.48.1,<2",
    "fastapi>=0.115,<1",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iread_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
