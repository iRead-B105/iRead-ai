[project]
name = "iread-ai"
version = "0.2.0"
description = "iRead AI service for pronunciation, personalized stories, and story images"
requires-python = ">=3.12"
dependencies = [
    "azure-cognitiveservices-speech>=1.48.1,<2",
    "fastapi>=0.116,<1",
    "g2pkiwi==0.1.0",
    "httpx>=0.28,<1",
    "kiwipiepy==0.20.4",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]
ui = [
    "streamlit>=1.60,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iread_ai"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/iread_ai/app.py" = ["B008", "E501"]
"src/iread_ai/mock_generators.py" = ["E501"]
