name: Sync to GitLab monorepo

on:
  push:
    branches:
      - "**"
  create:
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-sync-${{ github.event_name == 'push' && github.ref_name || github.event.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync branch content
    if: >-
      (github.event_name == 'push' && github.event.deleted == false) ||
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GITLAB_REPOSITORY: https://lab.ssafy.com/s15-webmobile2-sub1/S15P11B105.git
      SUBTREE_PREFIX: ${{ github.event.repository.name }}
      SOURCE_BRANCH: ${{ github.event_name == 'create' && github.event.ref || github.ref_name }}
      TARGET_BRANCH: ${{ github.event.repository.name }}/${{ github.event_name == 'create' && github.event.ref || github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}

      - name: Merge source branch into matching GitLab branch
        shell: bash
        env:
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_PUSH_TOKEN"

          auth_header="$(
            printf 'oauth2:%s' "$GITLAB_PUSH_TOKEN" |
              base64 |
              tr -d '\n'
          )"
          echo "::add-mask::$auth_header"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://lab.ssafy.com/.extraheader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $auth_header"

          sync_root="$(mktemp -d)"
          trap 'rm -rf "$sync_root"' EXIT

          for attempt in 1 2 3 4 5; do
            attempt_dir="$sync_root/monorepo-$attempt"
            target_exists=false

            if git ls-remote --exit-code --heads \
              "$GITLAB_REPOSITORY" \
              "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
              target_exists=true
              git clone --quiet \
                --branch "$TARGET_BRANCH" \
                --single-branch \
                "$GITLAB_REPOSITORY" \
                "$attempt_dir"
            else
              base_branch="$SUBTREE_PREFIX/develop"
              if [ "$SOURCE_BRANCH" = "main" ] || \
                ! git ls-remote --exit-code --heads \
                  "$GITLAB_REPOSITORY" \
                  "refs/heads/$base_branch" >/dev/null 2>&1; then
                base_branch=main
              fi

              git clone --quiet \
                --branch "$base_branch" \
                --single-branch \
                "$GITLAB_REPOSITORY" \
                "$attempt_dir"
              git -C "$attempt_dir" switch --quiet -c "$TARGET_BRANCH"
            fi

            git -C "$attempt_dir" config user.name "github-actions[bot]"
            git -C "$attempt_dir" config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$attempt_dir" remote add source "$GITHUB_WORKSPACE"
            git -C "$attempt_dir" fetch --quiet source "$SOURCE_SHA"

            if git -C "$attempt_dir" merge-base --is-ancestor \
              "$SOURCE_SHA" HEAD; then
              if [ "$target_exists" = "true" ]; then
                echo "$SOURCE_SHA is already synchronized."
                exit 0
              fi

              if git -C "$attempt_dir" push --quiet origin \
                "HEAD:refs/heads/$TARGET_BRANCH"; then
                echo "Created GitLab branch $TARGET_BRANCH."
                exit 0
              fi

              echo "Branch creation raced with another sync; retrying."
              sleep $((attempt * 2))
              continue
            fi

            git -C "$attempt_dir" merge \
              --allow-unrelated-histories \
              --strategy=ours \
              --no-commit \
              "$SOURCE_SHA"
            git -C "$attempt_dir" rm -r --ignore-unmatch "$SUBTREE_PREFIX"
            git -C "$attempt_dir" read-tree \
              --prefix="$SUBTREE_PREFIX/" \
              -u \
              "$SOURCE_SHA"
            git -C "$attempt_dir" commit \
              -m "chore(sync): $SUBTREE_PREFIX 동기화" \
              -m "source-repository: $GITHUB_REPOSITORY" \
              -m "source-ref: $SOURCE_BRANCH" \
              -m "source-commit: $SOURCE_SHA"

            if git -C "$attempt_dir" push --quiet origin \
              "HEAD:refs/heads/$TARGET_BRANCH"; then
              echo "Synchronized $GITHUB_REPOSITORY@$SOURCE_SHA."
              exit 0
            fi

            echo "Push raced with another repository; retrying ($attempt/5)."
            sleep $((attempt * 2))
          done

          echo "Failed to synchronize after 5 attempts." >&2
          exit 1

  delete:
    name: Delete matching GitLab branch
    if: >-
      github.event_name == 'delete' &&
      github.event.ref_type == 'branch' &&
      github.event.ref != 'main' &&
      github.event.ref != 'develop'
    runs-on: ubuntu-latest
    env:
      GITLAB_REPOSITORY: https://lab.ssafy.com/s15-webmobile2-sub1/S15P11B105.git
      SOURCE_BRANCH: ${{ github.event.ref }}
      TARGET_BRANCH: ${{ github.event.repository.name }}/${{ github.event.ref }}

    steps:
      - name: Delete GitLab branch
        shell: bash
        env:
          GITLAB_PUSH_TOKEN: ${{ secrets.GITLAB_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITLAB_PUSH_TOKEN"

          auth_header="$(
            printf 'oauth2:%s' "$GITLAB_PUSH_TOKEN" |
              base64 |
              tr -d '\n'
          )"
          echo "::add-mask::$auth_header"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://lab.ssafy.com/.extraheader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $auth_header"

          if ! git ls-remote --exit-code --heads \
            "$GITLAB_REPOSITORY" \
            "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "GitLab branch $TARGET_BRANCH is already absent."
            exit 0
          fi

          git push --quiet "$GITLAB_REPOSITORY" \
            ":refs/heads/$TARGET_BRANCH"
          echo "Deleted GitLab branch $TARGET_BRANCH."
