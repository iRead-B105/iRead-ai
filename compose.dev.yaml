name: iread-ai-dev

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      APP_ENV: development
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:-local-development-key}
      AI_MAX_AUDIO_BYTES: ${AI_MAX_AUDIO_BYTES:-20971520}
      STORY_PROVIDER: ${STORY_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-2400}
      OPENAI_CHAPTER_MAX_OUTPUT_TOKENS: ${OPENAI_CHAPTER_MAX_OUTPUT_TOKENS:-5000}
      OPENAI_VISUAL_SCENE_MAX_OUTPUT_TOKENS: ${OPENAI_VISUAL_SCENE_MAX_OUTPUT_TOKENS:-3200}
      CHAPTER_CANDIDATE_COUNT: ${CHAPTER_CANDIDATE_COUNT:-3}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-28}
      VISUAL_SCENE_TIMEOUT_SECONDS: ${VISUAL_SCENE_TIMEOUT_SECONDS:-8}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-600}
      GMS_KEY: ${GMS_KEY:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi}
      GMS_OPENAI_BASE_URL: ${GMS_OPENAI_BASE_URL:-}
      GMS_GEMINI_IMAGE_MODEL: ${GMS_GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image}
      GMS_IMAGE_TIMEOUT_SECONDS: ${GMS_IMAGE_TIMEOUT_SECONDS:-180}
      GMS_IMAGE_MAX_BYTES: ${GMS_IMAGE_MAX_BYTES:-12582912}
      GMS_IMAGE_MAX_RESPONSE_BYTES: ${GMS_IMAGE_MAX_RESPONSE_BYTES:-20971520}
      GMS_IMAGE_MAX_REQUEST_BYTES: ${GMS_IMAGE_MAX_REQUEST_BYTES:-20971520}
      CHARACTER_REFERENCE_DIR: /app/assets/character-references
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-koreacentral}
      AZURE_SPEECH_LANGUAGE: ${AZURE_SPEECH_LANGUAGE:-ko-KR}

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "127.0.0.1:8506:8501"
    environment:
      AI_INTERNAL_API_KEY: ${AI_INTERNAL_API_KEY:-local-development-key}
      IREAD_STORY_CHAPTER_ENDPOINT: http://api:8080/api/v3/story/chapters/generate
      IREAD_STORY_IMAGE_ENDPOINT: http://api:8080/api/v1/story/images/generate
    depends_on:
      api:
        condition: service_healthy
